<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Days Until Hannah is Home!</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/comic-sans-ms');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    background: linear-gradient(135deg, #6a0dad, #b57edc);
    min-height: 100vh;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px 60px;
  }

  h1 {
    text-align: center;
    font-size: 2.3em;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    margin-bottom: 10px;
    max-width: 700px;
  }

  .countdown-box {
    background: rgba(255,255,255,0.15);
    border: 3px dashed #ffffff;
    border-radius: 20px;
    padding: 30px 50px;
    text-align: center;
    margin: 20px 0 40px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .countdown-number {
    font-size: 5em;
    font-weight: bold;
    color: #fff566;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
    margin: 0;
  }

  .countdown-label {
    font-size: 1.3em;
    margin-top: 5px;
  }

  .card {
    background: rgba(255,255,255,0.92);
    color: #4b0082;
    border-radius: 18px;
    padding: 25px 30px;
    max-width: 550px;
    width: 100%;
    margin: 20px 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .card h2 {
    margin-top: 0;
    text-align: center;
    color: #6a0dad;
  }

  textarea {
    width: 100%;
    min-height: 80px;
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    font-size: 1em;
    border: 2px solid #b57edc;
    border-radius: 10px;
    padding: 10px;
    resize: vertical;
  }

  button {
    display: block;
    margin: 12px auto 0;
    background: #6a0dad;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 25px;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: #4b0082;
  }

  .suggestions-list {
    margin-top: 15px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 5px;
  }

  .suggestion-item {
    background: #f3e6ff;
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 0.95em;
  }

  .poll-options label {
    display: block;
    background: #f3e6ff;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .poll-options input {
    margin-right: 10px;
  }

  .poll-results {
    margin-top: 15px;
  }

  .poll-bar-container {
    background: #e0d0f5;
    border-radius: 10px;
    overflow: hidden;
    height: 22px;
    margin: 4px 0 2px;
  }

  .poll-bar {
    background: #6a0dad;
    height: 100%;
    color: white;
    font-size: 0.85em;
    text-align: right;
    padding-right: 6px;
    line-height: 22px;
    white-space: nowrap;
    transition: width 0.4s ease;
  }

  .poll-option-label {
    font-size: 0.9em;
    color: #4b0082;
    margin-top: 6px;
  }

  .status-msg {
    text-align: center;
    font-size: 0.85em;
    color: #6a0dad;
    margin-top: 10px;
    min-height: 18px;
  }

  .loading {
    text-align: center;
    color: white;
    font-size: 0.9em;
  }
</style>
</head>
<body>

  <h1>Days Until Hannah is Home! 💜</h1>

  <div class="countdown-box">
    <p class="countdown-number" id="countdownNumber">--</p>
    <p class="countdown-label" id="countdownLabel">Loading countdown...</p>
  </div>

  <!-- Suggestion Box -->
  <div class="card">
    <h2>💡 Suggest an Activity</h2>
    <p style="text-align:center; margin-top:-5px;">What should we do with Hannah when she's back?</p>
    <textarea id="suggestionInput" placeholder="e.g. Movie night, beach day, board games..."></textarea>
    <button id="submitSuggestion">Add Suggestion</button>
    <div class="status-msg" id="suggestionStatus"></div>
    <div class="suggestions-list" id="suggestionsList">
      <p class="loading">Loading suggestions...</p>
    </div>
  </div>

  <!-- Poll -->
  <div class="card">
    <h2>🎉 Are You Excited for Hannah to Come Home?</h2>
    <div class="poll-options" id="pollOptions">
      <label><input type="radio" name="poll" value="Yes, so excited!"> Yes, so excited!</label>
      <label><input type="radio" name="poll" value="Very excited"> Very excited</label>
      <label><input type="radio" name="poll" value="A little excited"> A little excited</label>
      <label><input type="radio" name="poll" value="Just counting down the days"> Just counting down the days 😄</label>
    </div>
    <button id="submitPoll">Vote</button>
    <div class="status-msg" id="pollStatus"></div>
    <div class="poll-results" id="pollResults"></div>
  </div>

<script>
  // ---------- Countdown ----------
  function updateCountdown() {
    const targetDate = new Date(2026, 7, 24); // August 24, 2026 (month is 0-indexed)
    const now = new Date();

    // normalize to midnight for a clean day count
    const targetMidnight = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
    const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const diffMs = targetMidnight - nowMidnight;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

    const numberEl = document.getElementById('countdownNumber');
    const labelEl = document.getElementById('countdownLabel');

    if (diffDays > 0) {
      numberEl.textContent = diffDays;
      labelEl.textContent = diffDays === 1 ? 'day to go!' : 'days to go!';
    } else if (diffDays === 0) {
      numberEl.textContent = '🎉';
      labelEl.textContent = "Hannah is home TODAY!";
    } else {
      numberEl.textContent = '💜';
      labelEl.textContent = "Hannah is home!";
    }
  }
  updateCountdown();

  // ---------- Suggestions ----------
  const suggestionInput = document.getElementById('suggestionInput');
  const submitSuggestionBtn = document.getElementById('submitSuggestion');
  const suggestionsList = document.getElementById('suggestionsList');
  const suggestionStatus = document.getElementById('suggestionStatus');

  async function loadSuggestions() {
    try {
      const listResult = await window.storage.list('suggestion:', true);
      const keys = listResult ? listResult.keys : [];

      if (!keys || keys.length === 0) {
        suggestionsList.innerHTML = '<p class="loading">No suggestions yet — be the first!</p>';
        return;
      }

      const items = [];
      for (const key of keys) {
        try {
          const res = await window.storage.get(key, true);
          if (res && res.value) {
            const data = JSON.parse(res.value);
            items.push(data);
          }
        } catch (e) {
          // skip missing/broken entries
        }
      }

      items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      if (items.length === 0) {
        suggestionsList.innerHTML = '<p class="loading">No suggestions yet — be the first!</p>';
        return;
      }

      suggestionsList.innerHTML = items
        .map(item => `<div class="suggestion-item">${escapeHtml(item.text)}</div>`)
        .join('');
    } catch (e) {
      suggestionsList.innerHTML = '<p class="loading">Could not load suggestions.</p>';
      console.error('Error loading suggestions:', e);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  submitSuggestionBtn.addEventListener('click', async () => {
    const text = suggestionInput.value.trim();
    if (!text) {
      suggestionStatus.textContent = 'Please write a suggestion first!';
      return;
    }

    submitSuggestionBtn.disabled = true;
    suggestionStatus.textContent = 'Saving...';

    try {
      const id = 'suggestion:' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      const result = await window.storage.set(id, JSON.stringify({ text, timestamp: Date.now() }), true);

      if (result) {
        suggestionInput.value = '';
        suggestionStatus.textContent = 'Suggestion added! 🎈';
        await loadSuggestions();
      } else {
        suggestionStatus.textContent = 'Something went wrong. Try again.';
      }
    } catch (e) {
      suggestionStatus.textContent = 'Something went wrong. Try again.';
      console.error('Error saving suggestion:', e);
    } finally {
      submitSuggestionBtn.disabled = false;
      setTimeout(() => { suggestionStatus.textContent = ''; }, 3000);
    }
  });

  // ---------- Poll ----------
  const pollOptionsValues = [
    "Yes, so excited!",
    "Very excited",
    "A little excited",
    "Just counting down the days"
  ];
  const submitPollBtn = document.getElementById('submitPoll');
  const pollStatus = document.getElementById('pollStatus');
  const pollResults = document.getElementById('pollResults');

  async function loadPollResults() {
    try {
      const counts = {};
      let total = 0;
      for (const option of pollOptionsValues) {
        try {
          const res = await window.storage.get('pollcount:' + option, true);
          const count = res && res.value ? parseInt(res.value, 10) : 0;
          counts[option] = count;
          total += count;
        } catch (e) {
          counts[option] = 0;
        }
      }

      pollResults.innerHTML = pollOptionsValues.map(option => {
        const count = counts[option] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        return `
          <div class="poll-option-label">${escapeHtml(option)} — ${count} vote${count === 1 ? '' : 's'}</div>
          <div class="poll-bar-container">
            <div class="poll-bar" style="width:${pct}%">${pct > 0 ? pct + '%' : ''}</div>
          </div>
        `;
      }).join('') + `<p style="text-align:center; margin-top:10px; font-size:0.85em; color:#6a0dad;">${total} total vote${total === 1 ? '' : 's'}</p>`;
    } catch (e) {
      pollResults.innerHTML = '<p class="loading">Could not load poll results.</p>';
      console.error('Error loading poll results:', e);
    }
  }

  submitPollBtn.addEventListener('click', async () => {
    const selected = document.querySelector('input[name="poll"]:checked');
    if (!selected) {
      pollStatus.textContent = 'Please choose an option first!';
      return;
    }

    submitPollBtn.disabled = true;
    pollStatus.textContent = 'Recording your vote...';

    try {
      const key = 'pollcount:' + selected.value;
      let current = 0;
      try {
        const res = await window.storage.get(key, true);
        current = res && res.value ? parseInt(res.value, 10) : 0;
      } catch (e) {
        current = 0;
      }

      const result = await window.storage.set(key, String(current + 1), true);

      if (result) {
        pollStatus.textContent = 'Thanks for voting! 🎉';
        await loadPollResults();
      } else {
        pollStatus.textContent = 'Something went wrong. Try again.';
      }
    } catch (e) {
      pollStatus.textContent = 'Something went wrong. Try again.';
      console.error('Error saving vote:', e);
    } finally {
      submitPollBtn.disabled = false;
      setTimeout(() => { pollStatus.textContent = ''; }, 3000);
    }
  });

  // Initial loads
  loadSuggestions();
  loadPollResults();
</script>

</body>
</html>
